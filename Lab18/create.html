<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairies</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html"><h1>All About Fairies</h1></a>
        <nav>
            <a href="types.html">Types of Fairies</a>
            <a href="create.html">Create a Fairy</a>
        </nav>
    </header>
    <main class="create">
        <h1>Create Your Own Fairy!</h1>
        <form>
            <label for="name">Fairy's Name</label>
            <input type="text" id="name" name="fairy-name">
            <label for="type">Type of Fairy</label>
            <input type="text" id="type" name="fairy-type">
            <label for="birthday">Fairy's Birthday</label> 
            <input type="date" id="birthday" name="fairy-birthday">
            <label for="color">Color of Fairy</label>
            <input type="color" id="color" name="fairy-color"> 
            <label for="creator">Fairy's Creator</label>
            <input type="text" id="creator" name="fairy-creator" value="Your Name Here"> 
            <div class="actions">
                <input type="reset"> 
                <input type="submit">       
            </div>       
        </form>
    </main>
</body>
</html>
